name: Frontend build and optional Pages demonstration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Require the hosted API origin on main
        if: github.ref == 'refs/heads/main'
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$API_URL"
      - name: Build static assets
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          include-hidden-files: true
      - name: Validate Pages configuration
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        env:
          API_URL: ${{ vars.VITE_API_URL }}
          DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          test -n "$API_URL"
          test -n "$DOMAIN"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages demonstration
        id: deployment
        uses: actions/deploy-pages@v4
